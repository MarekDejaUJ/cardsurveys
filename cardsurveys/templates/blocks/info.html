{% extends "blocks/_frame.html" %}
{% from "macros.html" import screen_fields, back_button with context %}
{% block content %}
<section class="screen narrow">
  <div class="content">{{ md(module.text|tx(lang, fallback)) }}</div>
  <form method="post" class="screen-form">
    {{ screen_fields(screen) }}
    <div class="controls">{{ back_button() }}<button class="act primary" type="submit">{{ t('survey.next', lang) }}</button></div>
  </form>
</section>
{% endblock %}
