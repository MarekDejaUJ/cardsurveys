{% extends "blocks/_frame.html" %}
{% from "macros.html" import screen_fields with context %}
{% block content %}
<section class="screen narrow">
  {% if module.prompt %}<p class="prompt">{{ module.prompt|tx(lang, fallback) }}</p>{% endif %}
  <div class="content stimulus">{{ md(content|tx(lang, fallback)) }}</div>
  <form method="post" class="screen-form">
    {{ screen_fields(screen) }}
    <div class="controls"><button class="act primary" type="submit">{{ t('survey.next', lang) }}</button></div>
  </form>
</section>
{% endblock %}
